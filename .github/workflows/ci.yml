name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B test
      - run: ./mvnw -q spring-boot:run -Dspring-boot.run.arguments=demo
      - run: python3 scripts/public_scan.py
